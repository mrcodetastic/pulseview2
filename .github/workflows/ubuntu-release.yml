name: Ubuntu Release Build (amd64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  PKG_NAME: pulseview2
  PKG_RELEASE: 1
  UBUNTU_CODENAME: resolute

jobs:
  build-ubuntu-amd64:
    name: Build PulseView2 Ubuntu 26.04 (amd64 .deb)
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    steps:
      - name: Checkout PulseView2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "PKG_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build .deb in Ubuntu 26.04 container
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/output:/output" \
            -e PKG_NAME="${{ env.PKG_NAME }}" \
            -e PKG_VERSION="${{ env.PKG_VERSION }}" \
            -e PKG_RELEASE="${{ env.PKG_RELEASE }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:${{ env.UBUNTU_CODENAME }} bash -c '
              set -ex

              ##############################################
              # 1. Install build dependencies (Qt6 stack)
              ##############################################
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build pkg-config git ca-certificates \
                autoconf autoconf-archive automake libtool \
                dpkg-dev file \
                libglib2.0-dev libglibmm-2.4-dev \
                libzip-dev zlib1g-dev \
                libusb-1.0-0-dev libftdi1-dev \
                libieee1284-3-dev libhidapi-dev \
                nettle-dev libavahi-client-dev \
                python3-dev python3-setuptools \
                libboost-dev libboost-filesystem-dev \
                libboost-serialization-dev libboost-system-dev libboost-thread-dev \
                qt6-base-dev libqt6svg6-dev qt6-tools-dev qt6-l10n-tools \
                libfftw3-dev sdcc doxygen swig

              PREFIX=/usr
              ARCH=$(dpkg --print-architecture)
              PKG_ROOT=/tmp/pkg-root
              NPROC=$(nproc)
              SIGROK_GIT=https://github.com/sigrokproject

              export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/pkgconfig:${PKG_CONFIG_PATH}"
              export LD_LIBRARY_PATH="${PREFIX}/lib:${PREFIX}/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH):${LD_LIBRARY_PATH}"

              ##############################################
              # 2. Build & install libserialport
              ##############################################
              cd /tmp
              git clone --depth=1 ${SIGROK_GIT}/libserialport.git
              cd libserialport
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install
              ldconfig

              ##############################################
              # 3. Build & install libsigrok
              ##############################################
              cd /tmp
              git clone --depth=1 ${SIGROK_GIT}/libsigrok.git
              cd libsigrok
              ./autogen.sh
              ./configure --prefix=${PREFIX} --disable-java --disable-python --disable-ruby
              make -j${NPROC}
              make install
              ldconfig

              ##############################################
              # 4. Build & install libsigrokdecode
              ##############################################
              cd /tmp
              git clone --depth=1 ${SIGROK_GIT}/libsigrokdecode.git
              cd libsigrokdecode
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install
              ldconfig

              ##############################################
              # 5. Build & install sigrok-cli
              ##############################################
              cd /tmp
              git clone --depth=1 ${SIGROK_GIT}/sigrok-cli.git
              cd sigrok-cli
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install

              ##############################################
              # 6. Build & install sigrok-firmware + fx2lafw
              ##############################################
              cd /tmp
              git clone --depth=1 ${SIGROK_GIT}/sigrok-firmware.git
              cd sigrok-firmware
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make install

              cd /tmp
              git clone --depth=1 ${SIGROK_GIT}/sigrok-firmware-fx2lafw.git
              cd sigrok-firmware-fx2lafw
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install

              ##############################################
              # 7. Build PulseView2 from THIS repository
              ##############################################
              cd /src
              cmake -S . -B /tmp/pv-build -G Ninja \
                -DCMAKE_INSTALL_PREFIX=${PREFIX} \
                -DCMAKE_BUILD_TYPE=Release \
                -DDISABLE_WERROR=TRUE \
                -DENABLE_DECODE=TRUE \
                -DENABLE_TESTS=FALSE
              ninja -C /tmp/pv-build

              ##############################################
              # 8. Stage everything into DESTDIR
              ##############################################
              cd /tmp/libserialport           && make install DESTDIR=${PKG_ROOT}
              cd /tmp/libsigrok               && make install DESTDIR=${PKG_ROOT}
              cd /tmp/libsigrokdecode         && make install DESTDIR=${PKG_ROOT}
              cd /tmp/sigrok-cli              && make install DESTDIR=${PKG_ROOT}
              cd /tmp/sigrok-firmware         && make install DESTDIR=${PKG_ROOT}
              cd /tmp/sigrok-firmware-fx2lafw && make install DESTDIR=${PKG_ROOT}
              DESTDIR=${PKG_ROOT} ninja -C /tmp/pv-build install

              # udev rules
              mkdir -p ${PKG_ROOT}/usr/lib/udev/rules.d
              for f in /tmp/libsigrok/contrib/6*-libsigrok*.rules; do
                [ -f "$f" ] && cp "$f" ${PKG_ROOT}/usr/lib/udev/rules.d/
              done

              ##############################################
              # 9. Derive runtime dependencies with dpkg-shlibdeps
              ##############################################
              cd ${PKG_ROOT}
              mkdir -p debian
              {
                echo "Source: ${PKG_NAME}"
                echo "Package: ${PKG_NAME}"
                echo "Architecture: ${ARCH}"
              } > debian/control

              ELF_LIST=""
              while IFS= read -r f; do
                if file -b "$f" | grep -qE "ELF.*(executable|shared object)"; then
                  ELF_LIST="${ELF_LIST} $f"
                fi
              done < <(find ${PKG_ROOT}/usr -type f \( -perm -u+x -o -name "*.so*" \))

              if [ -z "${ELF_LIST}" ]; then
                echo "ERROR: no ELF objects found in ${PKG_ROOT}" >&2
                exit 1
              fi

              DEPENDS=$(dpkg-shlibdeps -O --ignore-missing-info -S${PKG_ROOT} ${ELF_LIST} 2>/dev/null | sed -e "s/^shlibs:Depends=//")
              if [ -z "${DEPENDS}" ]; then
                echo "ERROR: dpkg-shlibdeps produced no dependencies" >&2
                exit 1
              fi

              DEPENDS="${DEPENDS}, libqt6svg6, python3"
              rm -rf debian
              echo "Generated Depends: ${DEPENDS}"

              ##############################################
              # 10. Build .deb with dpkg-deb
              ##############################################
              mkdir -p ${PKG_ROOT}/DEBIAN
              INSTALLED_SIZE=$(du -sk ${PKG_ROOT} | cut -f1)

              cat > ${PKG_ROOT}/DEBIAN/control << EOF
          Package: ${PKG_NAME}
          Version: ${PKG_VERSION}-${PKG_RELEASE}
          Architecture: ${ARCH}
          Maintainer: mrcodetastic
          Installed-Size: ${INSTALLED_SIZE}
          Depends: ${DEPENDS}
          Provides: pulseview, sigrok-pulseview, sigrok-cli, libsigrok, libsigrokdecode, libserialport, sigrok-firmware-fx2lafw
          Conflicts: pulseview, sigrok-pulseview, sigrok-cli, libsigrok-dev, libsigrokdecode-dev
          Section: electronics
          Priority: optional
          Homepage: https://github.com/mrcodetastic/pulseview2
          Description: PulseView2 + complete sigrok stack (Ubuntu 26.04)
           Complete sigrok suite including PulseView2 (Qt6-based logic analyzer
           GUI), sigrok-cli, libsigrok, libsigrokdecode, libserialport,
           and fx2lafw firmware for FX2-based logic analyzers.
          EOF

              cat > ${PKG_ROOT}/DEBIAN/postinst << "POSTINST"
          #!/bin/bash
          set -e
          ldconfig
          if command -v udevadm > /dev/null 2>&1; then
            udevadm control --reload-rules 2>/dev/null || true
            udevadm trigger 2>/dev/null || true
          fi
          POSTINST
              chmod 755 ${PKG_ROOT}/DEBIAN/postinst

              cat > ${PKG_ROOT}/DEBIAN/postrm << "POSTRM"
          #!/bin/bash
          set -e
          ldconfig
          POSTRM
              chmod 755 ${PKG_ROOT}/DEBIAN/postrm

              DEB_FILE="/output/${PKG_NAME}_${PKG_VERSION}-${PKG_RELEASE}_ubuntu26.04_${ARCH}.deb"
              dpkg-deb --build ${PKG_ROOT} ${DEB_FILE}

              ls -lh ${DEB_FILE}
              dpkg-deb --info ${DEB_FILE}
            '

      - name: Verify .deb installs and runs
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/output:/output" \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:${{ env.UBUNTU_CODENAME }} bash -c '
              set -ex
              apt-get update
              apt-get install -y --no-install-recommends /output/*.deb

              dpkg-query -W -f="\${Status}\n" pulseview2
              dpkg-query -W -f="\${Status}" pulseview2 | grep -q "install ok installed"

              for b in /usr/bin/pulseview /usr/bin/sigrok-cli; do
                echo "--- ldd $b ---"
                ldd "$b"
                if ldd "$b" | grep "not found"; then
                  echo "ERROR: unresolved libraries in $b" >&2
                  exit 1
                fi
              done

              sigrok-cli -V
              DECODERS=$(sigrok-cli -L | grep -c .)
              echo "decoders loaded: ${DECODERS}"
              [ "${DECODERS}" -gt 100 ]

              sigrok-cli -d demo:logic_channels=8 --samples 2000 -P i2c:scl=D0:sda=D1 | head -5

              rc=0
              QT_QPA_PLATFORM=offscreen timeout 20 pulseview || rc=$?
              if [ "${rc}" != "124" ] && [ "${rc}" != "0" ]; then
                echo "ERROR: pulseview exited with ${rc}" >&2
                exit 1
              fi
              echo "=== smoke test passed ==="
            '

      - name: Upload Ubuntu release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulseview2-ubuntu26.04-amd64-release
          path: output/*.deb

  publish-release:
    name: Publish Ubuntu Release
    needs: build-ubuntu-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Download Ubuntu release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pulseview2-ubuntu26.04-amd64-release
          path: release-assets

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "PulseView2 (${{ steps.tag.outputs.name }})"
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb

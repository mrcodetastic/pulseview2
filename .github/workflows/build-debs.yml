name: Build PulseView + Sigrok Stack Debian Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.4.3)'
        required: false
        default: '0.4.3'

env:
  PKG_NAME: sigrok-pulseview
  PKG_VERSION: ${{ github.event.inputs.version || '0.4.3' }}
  PKG_RELEASE: 1
  # Distro the packages are built for. The build runs inside this container
  # image, so this - not the runner label - is what the .deb links against.
  UBUNTU_CODENAME: resolute

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 and arm64 build natively on their own runners. Only riscv64
          # still needs QEMU emulation, which is roughly an order of magnitude
          # slower.
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64
            qemu: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            qemu: false
          - arch: riscv64
            runner: ubuntu-26.04
            platform: linux/riscv64
            qemu: true

    name: Build ${{ matrix.arch }}
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build .deb in container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/output:/output \
            -e PKG_NAME="${{ env.PKG_NAME }}" \
            -e PKG_VERSION="${{ env.PKG_VERSION }}" \
            -e PKG_RELEASE="${{ env.PKG_RELEASE }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:${{ env.UBUNTU_CODENAME }} bash -c '
              set -ex

              ##############################################
              # 1. Install all build dependencies
              ##############################################
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake pkg-config git ca-certificates \
                autoconf automake libtool \
                dpkg-dev file \
                libglib2.0-dev libglibmm-2.4-dev \
                libzip-dev zlib1g-dev \
                libusb-1.0-0-dev libftdi1-dev \
                libieee1284-3-dev libhidapi-dev \
                nettle-dev libavahi-client-dev \
                python3-dev python3-setuptools \
                libboost-dev libboost-test-dev libboost-filesystem-dev \
                libboost-serialization-dev libboost-system-dev libboost-thread-dev \
                qtbase5-dev libqt5svg5-dev qttools5-dev \
                libfftw3-dev sdcc doxygen swig

              PREFIX=/usr
              ARCH=$(dpkg --print-architecture)
              PKG_ROOT=/tmp/pkg-root
              NPROC=$(nproc)

              # Upstream sigrok components, cloned over HTTPS from the GitHub
              # mirrors: the git:// protocol is unauthenticated and is commonly
              # blocked on CI networks.
              SIGROK_GIT=https://github.com/sigrokproject

              export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/pkgconfig:${PKG_CONFIG_PATH}"
              export LD_LIBRARY_PATH="${PREFIX}/lib:${PREFIX}/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH):${LD_LIBRARY_PATH}"

              ##############################################
              # 2. Build & install libserialport (to system for subsequent builds)
              ##############################################
              cd /tmp
              git clone ${SIGROK_GIT}/libserialport.git
              cd libserialport
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install
              ldconfig

              ##############################################
              # 3. Build & install libsigrok
              ##############################################
              cd /tmp
              git clone ${SIGROK_GIT}/libsigrok.git
              cd libsigrok
              ./autogen.sh
              ./configure --prefix=${PREFIX} --disable-java
              make -j${NPROC}
              make install
              ldconfig

              ##############################################
              # 4. Build & install libsigrokdecode
              ##############################################
              cd /tmp
              git clone ${SIGROK_GIT}/libsigrokdecode.git
              cd libsigrokdecode
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              # Skip tests on arm64/riscv64 (known flaky)
              if [ "$ARCH" = "amd64" ]; then
                make check || true
              fi
              make install
              ldconfig

              ##############################################
              # 5. Build & install sigrok-cli
              ##############################################
              cd /tmp
              git clone ${SIGROK_GIT}/sigrok-cli.git
              cd sigrok-cli
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install

              ##############################################
              # 6. Build & install sigrok-firmware-fx2lafw
              ##############################################
              cd /tmp
              git clone ${SIGROK_GIT}/sigrok-firmware-fx2lafw.git
              cd sigrok-firmware-fx2lafw
              ./autogen.sh
              ./configure --prefix=${PREFIX}
              make -j${NPROC}
              make install

              ##############################################
              # 7. Build PulseView from THIS repository
              #
              # Build the checked-out tree, not a fresh upstream clone: this
              # fork carries the fixes a modern toolchain needs (CMake 4 policy
              # range, and dropping the Boost.System component that Boost 1.89+
              # no longer ships as a real library).
              ##############################################
              cd /src
              mkdir -p builddir && cd builddir
              cmake ../ \
                -DCMAKE_INSTALL_PREFIX=${PREFIX} \
                -DCMAKE_BUILD_TYPE=Release \
                -DDISABLE_WERROR=y \
                -DENABLE_DECODE=y \
                -DENABLE_TESTS=OFF
              make -j${NPROC}

              ##############################################
              # 8. Re-install everything into DESTDIR staging root
              ##############################################
              cd /tmp/libserialport    && make install DESTDIR=${PKG_ROOT}
              cd /tmp/libsigrok        && make install DESTDIR=${PKG_ROOT}
              cd /tmp/libsigrokdecode   && make install DESTDIR=${PKG_ROOT}
              cd /tmp/sigrok-cli        && make install DESTDIR=${PKG_ROOT}
              cd /tmp/sigrok-firmware-fx2lafw && make install DESTDIR=${PKG_ROOT}
              cd /src/builddir          && make install DESTDIR=${PKG_ROOT}

              # udev rules
              mkdir -p ${PKG_ROOT}/usr/lib/udev/rules.d
              for f in /tmp/libsigrok/contrib/6*-libsigrok*.rules; do
                [ -f "$f" ] && cp "$f" ${PKG_ROOT}/usr/lib/udev/rules.d/
              done

              ##############################################
              # 9. Derive runtime dependencies from the built binaries
              #
              # Do not hardcode the Depends list: library package names and
              # SONAMEs move between Ubuntu releases. Noble had libzip4t64,
              # Boost 1.83 and Python 3.12; resolute has libzip5, Boost 1.90
              # and Python 3.14, and libieee1284-3 was renamed to
              # libieee1284-3t64. dpkg-shlibdeps reads the real ELF NEEDED
              # entries and asks dpkg which package owns each one, so the
              # dependencies always match what was actually linked.
              ##############################################
              cd ${PKG_ROOT}
              mkdir -p debian
              {
                echo "Source: ${PKG_NAME}"
                echo "Package: ${PKG_NAME}"
                echo "Architecture: ${ARCH}"
              } > debian/control

              ELF_LIST=""
              while IFS= read -r f; do
                if file -b "$f" | grep -qE "ELF.*(executable|shared object)"; then
                  ELF_LIST="${ELF_LIST} $f"
                fi
              done < <(find ${PKG_ROOT}/usr -type f \( -perm -u+x -o -name "*.so*" \))

              if [ -z "${ELF_LIST}" ]; then
                echo "ERROR: no ELF objects found in ${PKG_ROOT}" >&2
                exit 1
              fi

              # -S${PKG_ROOT} tells dpkg-shlibdeps that the libraries staged in
              # this package satisfy themselves, so the .deb does not end up
              # depending on the system libserialport0 / libsigrok packages that
              # it actually bundles.
              DEPENDS=$(dpkg-shlibdeps -O --ignore-missing-info -S${PKG_ROOT} ${ELF_LIST} 2>/dev/null | sed -e "s/^shlibs:Depends=//")

              if [ -z "${DEPENDS}" ]; then
                echo "ERROR: dpkg-shlibdeps produced no dependencies" >&2
                exit 1
              fi

              # Runtime-only dependencies that leave no ELF NEEDED entry:
              # libqt5svg5 is dlopened as a Qt imageformats plugin to render the
              # SVG icons, and python3 provides the stdlib that the
              # libsigrokdecode protocol decoders import.
              DEPENDS="${DEPENDS}, libqt5svg5, python3"

              rm -rf debian
              echo "Generated Depends: ${DEPENDS}"

              ##############################################
              # 10. Build .deb with dpkg-deb
              ##############################################
              mkdir -p ${PKG_ROOT}/DEBIAN
              INSTALLED_SIZE=$(du -sk ${PKG_ROOT} | cut -f1)

              cat > ${PKG_ROOT}/DEBIAN/control << EOF
          Package: ${PKG_NAME}
          Version: ${PKG_VERSION}-${PKG_RELEASE}
          Architecture: ${ARCH}
          Maintainer: seb@penthertz.com
          Installed-Size: ${INSTALLED_SIZE}
          Depends: ${DEPENDS}
          Provides: pulseview, sigrok-cli, libsigrok, libsigrokdecode, libserialport, sigrok-firmware-fx2lafw
          Conflicts: pulseview, sigrok-cli, libsigrok-dev, libsigrokdecode-dev
          Section: electronics
          Priority: optional
          Homepage: https://sigrok.org
          Description: PulseView + complete sigrok stack
           Complete sigrok suite including PulseView (Qt-based logic analyzer
           GUI), sigrok-cli, libsigrok, libsigrokdecode, libserialport,
           and fx2lafw firmware for FX2-based logic analyzers.
          EOF

              # Post-install: ldconfig + udev reload
              cat > ${PKG_ROOT}/DEBIAN/postinst << "POSTINST"
          #!/bin/bash
          set -e
          ldconfig
          if command -v udevadm > /dev/null 2>&1; then
            udevadm control --reload-rules 2>/dev/null || true
            udevadm trigger 2>/dev/null || true
          fi
          POSTINST
              chmod 755 ${PKG_ROOT}/DEBIAN/postinst

              # Post-remove: ldconfig
              cat > ${PKG_ROOT}/DEBIAN/postrm << "POSTRM"
          #!/bin/bash
          set -e
          ldconfig
          POSTRM
              chmod 755 ${PKG_ROOT}/DEBIAN/postrm

              DEB_FILE="/output/${PKG_NAME}_${PKG_VERSION}-${PKG_RELEASE}_${ARCH}.deb"
              dpkg-deb --build ${PKG_ROOT} ${DEB_FILE}

              echo "=== Built package ==="
              ls -lh ${DEB_FILE}
              dpkg-deb --info ${DEB_FILE}
              echo "=== Package contents (first 80 lines) ==="
              dpkg-deb --contents ${DEB_FILE} | head -80
            '

      # Run the smoke test on every natively-built architecture. It is skipped
      # only for the QEMU-emulated riscv64 build, where launching a Qt GUI under
      # emulation is slow and prone to spurious failures.
      - name: Verify .deb installs and runs
        if: ${{ !matrix.qemu }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/output:/output \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:${{ env.UBUNTU_CODENAME }} bash -c '
              set -ex
              apt-get update

              # Install the package the way a user would. apt has to resolve the
              # generated Depends, so a wrong or missing dependency fails here
              # rather than on the user machine.
              apt-get install -y --no-install-recommends /output/*.deb

              # A half-configured package means a dependency problem.
              dpkg-query -W -f="\${Status}\n" sigrok-pulseview
              dpkg-query -W -f="\${Status}" sigrok-pulseview | grep -q "install ok installed"

              # Fail on any unresolved SONAME, which is what a stale hardcoded
              # dependency list leaves behind.
              for b in /usr/bin/pulseview /usr/bin/sigrok-cli; do
                echo "--- ldd $b ---"
                ldd "$b"
                if ldd "$b" | grep "not found"; then
                  echo "ERROR: unresolved libraries in $b" >&2
                  exit 1
                fi
              done

              # sigrok-cli exercises libsigrok; -L loads every protocol decoder,
              # which exercises libsigrokdecode against the distro Python. This
              # is what catches a Python 3.12 vs 3.14 mismatch.
              sigrok-cli -V
              DECODERS=$(sigrok-cli -L | grep -c .)
              echo "decoders loaded: ${DECODERS}"
              [ "${DECODERS}" -gt 100 ]

              # Run a real decode end to end using the demo driver.
              sigrok-cli -d demo:logic_channels=8 --samples 2000 -P i2c:scl=D0:sda=D1 | head -5

              # Confirm the GUI binary actually starts, under the offscreen Qt
              # platform plugin. It has no reason to exit on its own, so the
              # expected result is the timeout killing it (exit 124).
              rc=0
              QT_QPA_PLATFORM=offscreen timeout 20 pulseview || rc=$?
              if [ "${rc}" != "124" ] && [ "${rc}" != "0" ]; then
                echo "ERROR: pulseview exited with ${rc}" >&2
                exit 1
              fi
              echo "=== smoke test passed ==="
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}_${{ matrix.arch }}
          path: output/*.deb
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true

      - name: List packages
        run: |
          echo "=== Built packages ==="
          ls -lh debs/
          for f in debs/*.deb; do
            echo "--- $(basename $f) ---"
            dpkg-deb --info "$f" | grep -E '(Package|Version|Architecture|Installed-Size|Depends|Provides)'
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          generate_release_notes: true
          body: |
            ## Sigrok PulseView ${{ env.PKG_VERSION }}

            Pre-built Debian packages for Ubuntu Resolute Raccoon (26.04).
            Includes the full sigrok stack: libserialport, libsigrok, libsigrokdecode, sigrok-cli, PulseView, and fx2lafw firmware.

            Built against the Ubuntu 26.04 library stack (Qt 5.15.18, Boost 1.90,
            libzip 5, Python 3.14). These packages will not install on Ubuntu 24.04
            (noble), which ships Boost 1.83, libzip 4 and Python 3.12.

            ### Install
            ```bash
            wget <url-to-deb>
            sudo apt install ./sigrok-pulseview_*.deb
            sudo ldconfig
            sudo udevadm control --reload-rules && sudo udevadm trigger
            ```

            ### Included
            - **PulseView** - Qt-based logic analyzer GUI
            - **sigrok-cli** - Command-line interface
            - **libsigrok** - Hardware access library
            - **libsigrokdecode** - Protocol decoder library
            - **libserialport** - Serial port library
            - **fx2lafw** - Firmware for FX2-based logic analyzers

            ### Architectures
            - `amd64` - x86_64
            - `arm64` - AArch64
            - `riscv64` - RISC-V 64

      - name: Upload debs for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: all-debs-${{ env.PKG_VERSION }}
          path: debs/*.deb
          retention-days: 90
